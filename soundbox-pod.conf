# ======================
# 1. 加载 GeoLite2 数据库 (关键修正!)
# ======================
# 优先从代理头中提取真实客户端 IP（Cloudflare/通用代理）
map $http_x_forwarded_for $client_ip_from_xff {
    ~^\s*(?<first_ip>[^,\s]+) $first_ip;
    default "";
}

map $http_cf_connecting_ip $client_ip_pref_cdn {
    default $http_cf_connecting_ip;
    "" "";
}

map "$client_ip_pref_cdn$client_ip_from_xff" $client_ip_chain_pick {
    ~^(?<picked>[0-9a-fA-F\.:]+)$ $picked;
    default "";
}

map $client_ip_chain_pick $client_ip_for_geoip2 {
    "" $remote_addr;
    default $client_ip_chain_pick;
}

geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    $geoip2_data_country_code source=$client_ip_for_geoip2 country iso_code;  # 提取国家代码
    $geoip2_data_country_name source=$client_ip_for_geoip2 country names en;  # 可选：国家名称
}

# ======================
# 2. 创建国家代码映射
# ======================
map $geoip2_data_country_code $country_path {
    default         "";    # 默认国际版
    CN              "";       # 中国：保留根路径
    US              "/us";    # 美国
    JP              "/jp";    # 日本
    SG              "/ca";    # 新加坡 → 按您要求跳转到/ca
    CA              "/ca";    # 加拿大
    AU              "/au";    # 澳大利亚
    DE              "/de";    # 德国
    FR              "/fr";    # 法国
    # 可在此添加更多国家映射...
}

# 1. 管理后台服务配置 (admin.soundbox-pod.com)
# -----------------------------------------------------------
# 1.1 HTTP 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name admin.soundbox-pod.com;
    
    # 301 永久重定向到 HTTPS 地址
    return 301 https://admin.soundbox-pod.com$request_uri;
}

# 1.2 HTTPS 主服务
server {
    # 使用新的HTTP配置方式
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on; # 单独使用http2指令开启HTTP/2

    # HTTP/3 配置
    listen 443 quic;
    listen [::]:443 quic;
    http3 on; # 明确启用HTTP/3
    add_header Alt-Svc 'h3=":443"; ma=86400'; # 告知客户端支持 HTTP/3

    server_name admin.soundbox-pod.com;

    # SSL 证书配置
    ssl_certificate /home/zpy2025/mnt/sbxbooth/app/webapp/cert/soundboxpod.com.pem;
    ssl_certificate_key /home/zpy2025/mnt/sbxbooth/app/webapp/cert/soundboxpod.com.key;

    # 安全增强配置 (与所有 HTTPS 服务共享此部分，或提取到通用文件)
    ssl_session_timeout 24h; # 增加会话超时时间
    ssl_session_cache shared:SSL:50m; # 增加 SSL 会话缓存大小
    ssl_session_tickets on; # 对新版本TLS启用会话票证
    ssl_early_data on; # 开启TLS 1.3的0-RTT
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off; # TLS 1.3 建议关闭此选项
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_ecdh_curve X25519:prime256v1:secp384r1; # 更现代的椭圆曲线选择
    ssl_dhparam /home/zpy2025/mnt/sbxbooth/app/webapp/cert/dhparam.pem; # 添加 DH 参数文件，提高安全性
    ssl_buffer_size 4k; # 优化 SSL 缓冲区大小
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload"; # HSTS

    # 网站根目录和索引文件
    root /home/zpy2025/opt/sbxboot/ca/webapp/sbxboothadmin/;
    index index.html;

    # 静态资源缓存控制 - 精细化控制不同类型资源
    # HTML文件
    location ~* \.(html|htm)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        etag on;
        add_header Last-Modified $date_gmt;
    }

    # CSS和JS
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        etag on;
    }

    # 图片文件 - 支持WebP
    location ~* \.(jpg|jpeg|png|gif|ico)$ {
        try_files $uri$webp_suffix $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept;
        access_log off;
        etag on;
    }

    # 字体文件
    location ~* \.(svg|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        etag on;
    }

    # 新增：处理 /ca 路径 (加拿大)
    location /ca/ {
        alias /home/zpy2025/opt/sbxboot/ca/webapp/sbxboothadmin/;
        try_files $uri $uri/ /ca/index.html; # 针对 /ca 下的SPA应用
        index index.html;
    }

    # 主请求处理 (SPA 应用)
    location / {
        try_files $uri $uri/ @router; # 尝试查找文件或目录，否则重定向到 SPA 路由

        # 预连接/预加载资源指令
        add_header Link "</css/main.css>; rel=preload; as=style";
        add_header Link "</js/main.js>; rel=preload; as=script";

        # 不缓存 HTML 文件 (使用 if 指令，可能存在性能问题，但在此处功能有效)
        if ($request_filename ~* .*\.(?:htm|html)$) {
            add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
            access_log on;
        }

        # 启用代理缓存
        proxy_cache WEBCACHE;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_background_update on;
    }

    # SPA 路由重定向到 index.html
    location @router {
        rewrite ^.*$ /index.html last;
    }

    ### 安全保护 - 禁止访问敏感文件 ###
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    ### 允许访问 Let's Encrypt 证书验证目录 ###
    location ~ \.well-known {
        allow all;
        # 严格禁止在 .well-known 目录下执行脚本文件 (使用 if 指令，请注意其潜在问题)
        if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
            return 403;
        }
    }

    ### 错误页面处理 ###
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root html; # 错误页面文件所在的根目录
    }

    ### 健康检查端点 ###
    location /health {
        access_log off; # 不记录健康检查日志
        return 200 "OK";
    }

    location /soundbox/ {
        # 代理到后端实际监听的 IP 和端口
        proxy_pass http://47.237.98.37:8097/soundbox/;
        proxy_set_header Host $host; # 传递原始 Host 头
        proxy_set_header X-Real-IP $remote_addr; # 传递真实客户端 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 传递代理链中的所有 IP
        proxy_set_header X-Forwarded-Proto $scheme; # 传递请求协议（http 或 https）

        # 优化代理缓冲设置
        proxy_buffering on; # 启用代理缓冲
        proxy_buffer_size 16k; # 代理响应的缓冲区大小
        proxy_buffers 8 32k; # 增加单个连接的缓冲区数量和大小
        proxy_busy_buffers_size 64k; # 在后端数据没有完全接收完毕时可以向客户端传送的缓冲区大小
        proxy_temp_file_write_size 64k; # 一次写入临时文件的大小限制

        # 后端缓存设置
        proxy_cache WEBCACHE;
        proxy_cache_valid 200 10m; # API数据缓存时间短一些
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status; # 显示缓存状态

        # 建议添加超时设置以避免后端响应慢导致的问题
        proxy_connect_timeout 60s; # 与后端建立连接的超时时间
        proxy_read_timeout 60s; # 从后端读取响应的超时时间
        proxy_send_timeout 60s; # 发送请求到后端的超时时间

        # 额外的代理配置，可能有助于解决某些连接问题
        proxy_http_version 1.1; # 使用 HTTP/1.1 协议与后端通信
        proxy_set_header Connection ""; # 移除 Connection header，有助于保持连接活跃
    }

    location /api/ {
        # 代理到后端实际监听的 IP 和端口
        proxy_pass http://47.237.98.37:8097/soundbox/;
        proxy_set_header Host $host; # 传递原始 Host 头
        proxy_set_header X-Real-IP $remote_addr; # 传递真实客户端 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 传递代理链中的所有 IP
        proxy_set_header X-Forwarded-Proto $scheme; # 传递请求协议（http 或 https）

        # 优化代理缓冲设置
        proxy_buffering on; # 启用代理缓冲
        proxy_buffer_size 16k; # 代理响应的缓冲区大小
        proxy_buffers 8 32k; # 增加单个连接的缓冲区数量和大小
        proxy_busy_buffers_size 64k; # 在后端数据没有完全接收完毕时可以向客户端传送的缓冲区大小
        proxy_temp_file_write_size 64k; # 一次写入临时文件的大小限制

        # 后端缓存设置
        proxy_cache WEBCACHE;
        proxy_cache_valid 200 10m; # API数据缓存时间短一些
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status; # 显示缓存状态

        # 建议添加超时设置以避免后端响应慢导致的问题
        proxy_connect_timeout 60s; # 与后端建立连接的超时时间
        proxy_read_timeout 60s; # 从后端读取响应的超时时间
        proxy_send_timeout 60s; # 发送请求到后端的超时时间

        # 额外的代理配置，可能有助于解决某些连接问题
        proxy_http_version 1.1; # 使用 HTTP/1.1 协议与后端通信
        proxy_set_header Connection ""; # 移除 Connection header，有助于保持连接活跃
    }

    # 安全头优化
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 日志配置 (为 admin 子域名单独配置日志)
    access_log /var/log/nginx/admin-soundbox-pod-access.log combined buffer=32k flush=5s; # 增加缓冲大小
    error_log /var/log/nginx/admin-soundbox-pod-error.log warn;
}

