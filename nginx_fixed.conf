# ======================
# 1. 主站服务配置 (www.soundbox-pod.com)
# ======================

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name www.soundbox-pod.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS 配置
server {
    listen 443 ssl http2;
    server_name www.soundbox-pod.com;

    # SSL 证书配置
    ssl_certificate /home/zpy2025/mnt/sbxbooth/app/webapp/cert/soundboxpod.com.pem;
    ssl_certificate_key /home/zpy2025/mnt/sbxbooth/app/webapp/cert/soundboxpod.com.key;

    # 安全增强配置
    ssl_session_timeout 24h;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets on;
    ssl_early_data on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_dhparam /home/zpy2025/mnt/sbxbooth/app/webapp/cert/dhparam.pem;
    ssl_buffer_size 4k;
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload";

    # 静态资源缓存控制
    location ~* \.(html|htm)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        etag on;
        add_header Last-Modified $date_gmt;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        etag on;
    }

    location ~* \.(jpg|jpeg|png|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        etag on;
    }

    location ~* \.(svg|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        etag on;
    }

    # 子路径 /ca 的配置 (优先级高，放在前面)
    location /ca/ {
        alias /home/zpy2025/opt/sbxboot/ca/webapp/sbxboothadmin/;
        index index.html 200.html;
        try_files $uri $uri/ @ca_router;
    }

    # CA应用的SPA路由处理
    location @ca_router {
        rewrite ^/ca/(.*)$ /ca/200.html last;
    }

    # API 代理配置
    location /soundbox/ {
        proxy_pass http://47.237.98.37:8097/soundbox/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://47.237.98.37:8097/soundbox/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 主请求处理 (SPA 应用) - 放在最后，作为默认处理
    location / {
        # 主站根目录和索引文件
        root /home/zpy2025/mnt/sbxbooth/app/webapp/sbxboothadmin;
        index index.html 200.html;
        try_files $uri $uri/ @main_router;
    }

    # 主应用的SPA路由重定向
    location @main_router {
        rewrite ^.*$ /200.html last;
    }

    # 安全头优化
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}